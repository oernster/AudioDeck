[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-deck"
dynamic = ["version"]
description = "Professional audio device switcher for Windows with Stream Deck integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pycaw>=20230407",
    "comtypes>=1.2.0",
]

[project.optional-dependencies]
# Kept in step with requirements-dev.txt, which is the list the development
# guide tells people to install. No mock library appears here on purpose:
# TESTING.md states the suite uses hand-written fakes instead, so naming
# pytest-mock as a dependency would invite exactly what the project decided
# against.
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "mypy>=1.4.1",
    "ruff>=0.0.280",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    # Package markers hold no logic.
    "*/__init__.py",
    # Composition root: constructs real COM objects and a QApplication.
    "src/main.py",
    # PySide6 view construction. Widget layout is asserted by looking at the
    # running app, not by brittle tests that break on every UI tweak.
    "src/presentation/views/*",
    # Raw COM against the live Windows audio endpoints. Exercising these would
    # need real hardware, plus the controller would change the machine's actual
    # default devices, so they are driven through fakes at their seams instead.
    "src/infrastructure/windows/device_enumerator.py",
    "src/infrastructure/windows/windows_device_controller.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol and abstract method bodies.
    "^\\s*\\.\\.\\.$",
]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of a package marker.
"__init__.py" = ["F401"]
# The entry point must insert the project root on sys.path BEFORE importing
# from src, so its imports cannot be hoisted or reordered. Sorting them would
# break running `python src/main.py` directly.
"src/main.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true